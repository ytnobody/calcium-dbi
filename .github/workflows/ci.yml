name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Calcium
        run: |
          git clone --depth 1 https://github.com/ytnobody/calcium-lang.git /tmp/calcium-lang
          cd /tmp/calcium-lang
          go build -o /usr/local/bin/calcium ./cmd/calcium

      - name: Setup module symlink
        run: |
          mkdir -p dbi
          ln -sf ../mod.ca dbi/mod.ca

      - name: Lint Calcium sources
        run: |
          calcium lint mod.ca
          calcium lint mod.test.ca

      - name: Run tests
        run: calcium mod.test.ca